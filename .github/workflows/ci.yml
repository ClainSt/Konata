name: CI

on:
  push:
    branches:
      - v2
      - main
  pull_request:
    branches:
      - v2
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: 检测变更路径
    runs-on: ubuntu-latest
    outputs:
      android_affected: ${{ steps.filter.outputs.android_affected }}
    steps:
      - name: 检出仓库历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 判断是否涉及 Android 或源码/依赖变更
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "android_affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "android_affected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "android/")
          fi

          if echo "$CHANGED" | grep -Eq '^(android/|lib/|packages/|pubspec\.yaml|pubspec\.lock|native/konata-native/android-manifest\.json|\.github/workflows/ci\.yml)'; then
            echo "android_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_affected=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-test:
    name: 静态分析与单元测试 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - &install_linux_dependencies
        name: 安装 Linux 原生构建依赖
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libsqlite3-dev libgtk-3-dev libx11-dev libxi-dev
          pkg-config --print-errors --exists gtk+-3.0 x11 xi

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 缓存 Android 原生运行时
        uses: actions/cache@v4
        with:
          path: native/konata-native/android
          key: konata-native-android-${{ hashFiles('native/konata-native/android-manifest.json') }}

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 校验并拉取 Android 原生库（供符号探针单测使用）
        run: dart run tool/fetch_native.dart android

      - name: 静态分析（0 error / 0 warning / 0 info）
        run: flutter analyze

      - name: 执行自动化单元测试
        run: flutter test

  android-debug-build:
    name: Android ARM64 无签名编译校验
    needs:
      - detect-changes
      - analyze-and-test
    if: needs.detect-changes.outputs.android_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - *install_linux_dependencies

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v4

      - name: 缓存 Android 原生运行时
        uses: actions/cache@v4
        with:
          path: native/konata-native/android
          key: konata-native-android-${{ hashFiles('native/konata-native/android-manifest.json') }}

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 校验并拉取 Android 原生库
        run: dart run tool/fetch_native.dart android

      - name: 编译 Android ARM64 Debug APK（不签名、不发布）
        run: flutter build apk --debug -t lib/main_android.dart --target-platform android-arm64
