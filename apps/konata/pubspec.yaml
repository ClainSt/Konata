name: konata
description: "Konata v3 双端极薄应用壳（Windows 桌面 / Android 手机与平板）"
publish_to: none
version: 1.0.0+2006

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  engine_playback:
  engine_scraping:
  engine_sources:
  feature_detail:
  feature_history:
  feature_library:
  feature_lyrics:
  feature_player_audio:
  feature_player_video:
  feature_scan_viewer:
  feature_settings:
  feature_sources:
  feature_sync:
  feature_tracker_sync:
  konata_contracts:
  konata_design_system:
  konata_storage:
  sqlite3: ^3.9.1
  flutter_acrylic: ^1.1.4
  window_manager: ^0.7.0
  file_picker: ^13.4.1
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  media_kit_libs_windows_video:
    path: ../../packages/native_plugins/media_kit_libs_windows_video
  media_kit_libs_android_video:
    path: ../../packages/native_plugins/media_kit_libs_android_video
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/konata_icon.png
    - assets/data/bangumi_tmdb_map.bin
    - assets/data/bangumi_tmdb_manifest.json
  fonts:
    - family: KonataInter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: KonataNotoCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-VF.ttf
