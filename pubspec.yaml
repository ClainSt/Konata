name: ccplayer
description: "Konata - 轻量级个人本地/远程动画影视资料库"
publish_to: 'none'
version: 1.0.0+2006

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理与强类型本地持久化
  flutter_riverpod: ^2.6.1
  drift: ^2.24.0
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.5.28

  # 桌面窗口、文件选择、配置与安全存储
  flutter_acrylic: ^1.1.4
  window_manager: ^0.4.3
  file_picker: ^13.3.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # 网络、协议与工具
  http: ^1.6.0
  smb_connect:
    path: packages/smb_connect
  xml: ^7.0.1
  crypto: ^3.0.8
  ffi: ^2.1.3

  # 固定并做 SHA-256 校验的本地 libmpv 原生运行时打包插件
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video

dev_dependencies:
  integration_test:
    sdk: flutter
  drift_dev: ^2.24.1
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_windows:
    path: packages/path_provider_windows

flutter:
  uses-material-design: true
  assets:
    - assets/icons/konata_icon.png
  fonts:
    - family: KonataInter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: KonataNotoCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-VF.ttf

dependency_overrides:
  # 便携 Windows 数据/缓存路径（含 shared_preferences 自身 provider）
  path_provider_windows:
    path: packages/path_provider_windows
  # 便携 DPAPI 加密凭据（无 ATL 依赖）
  flutter_secure_storage_windows:
    path: packages/flutter_secure_storage_windows
