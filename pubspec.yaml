name: konata_workspace
description: "Konata v3 多包工作区根清单"
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/konata
  - packages/foundation/konata_contracts
  - packages/foundation/konata_design_system
  - packages/foundation/konata_storage
  - packages/engines/engine_cloud_drives
  - packages/engines/engine_sources
  - packages/engines/engine_scraping
  - packages/engines/engine_playback
  - packages/features/feature_detail
  - packages/features/feature_history
  - packages/features/feature_library
  - packages/features/feature_lyrics
  - packages/features/feature_player_audio
  - packages/features/feature_player_video
  - packages/features/feature_scan_viewer
  - packages/features/feature_settings
  - packages/features/feature_sources
  - packages/features/feature_sync
  - packages/features/feature_tracker_sync

dev_dependencies:
  crypto: ^3.0.8
  ffi: ^2.1.3
  flutter_lints: ^6.0.0
  path: ^1.9.1

dependency_overrides:
  # 绿色便携 Windows 数据/缓存路径（含 shared_preferences 自身 provider）
  path_provider_windows:
    path: packages/native_plugins/path_provider_windows
  # 绿色便携 Windows DPAPI 加密凭据（无 ATL 依赖）
  flutter_secure_storage_windows:
    path: packages/native_plugins/flutter_secure_storage_windows
